# tinyproxy for the local-ci review container (proxy.Dockerfile).
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 20
LogLevel Connect
# No Allow lines: any client that can reach port 8888 may connect. That is the review
# container (the only other member of the internal network) and also any container on the
# host's default bridge, which the proxy joins for its own egress. Both get only what the
# filter below allows, and only for the minutes a run lasts.

# Default deny; the allow file lists exact hostnames.
Filter "/etc/tinyproxy/allow"
FilterType fnmatch
FilterDefaultDeny Yes

# HTTPS only.
ConnectPort 443
