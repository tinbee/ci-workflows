# Reusable workflow: a cold-context model review of a pull request.
#
# Only the diff, the repo and the rule docs are visible to it -- none of the author's
# reasoning, none of the PR description's justifications. That is the point: a reviewer
# who has been told why the code is fine reviews the explanation instead of the code.
#
# Findings are published as INLINE REVIEW COMMENTS, one thread per finding, with
# anything unanchorable in the review body. Threads are what make a finding
# individually answerable: reply with why you disagree and resolve it, exactly as with
# Copilot. It also means a repo whose branch protection sets
# `required_review_thread_resolution` gets the review as a real merge gate for free,
# with a per-finding override -- where a single PR comment carrying N findings is
# invisible to that rule, so a PR can merge with every finding still open. That is not
# hypothetical: it is how tinbee/envmesh#116 merged five still-under-review commits.
#
# Triggered by adding a label once a PR has SETTLED (CI green, the Copilot rounds done),
# never on every push: a review cancelled or superseded by the next push costs quota and
# minutes and is read by nobody. The job consumes the label as its first step, so adding
# it again requests another pass.
#
# The label also chooses the model. `claude-review` reviews with the `model` and `effort`
# inputs. `claude-review:<model>[:<effort>]` -- `claude-review:opus`,
# `claude-review:claude-opus-5-5:max` -- reviews that one PR with that model instead. The
# model goes to the CLI verbatim (an alias such as `opus`, or a full model id), so a model
# released tomorrow works the day the CLI accepts its id: create the label, change nothing
# here. Nothing is mapped or allow-listed, so nothing goes stale; the value is only held to
# a strict SHAPE, because it reaches the CLI's arguments. A malformed label fails the job
# before any review, and a model the CLI rejects fails the Review step -- neither falls back
# to the default, which would answer a different question than the one the label asked.
# Whoever can apply a label can pick the model, and so spend its quota: that is triage
# access, the same people who can already request a review.
#
# Two ways to authenticate; give the job exactly one.
#   - A Max subscription token (`claude setup-token`) passed as CLAUDE_CODE_OAUTH_TOKEN. Set
#     it once at the org level OF EACH CALLING ORG: a reusable workflow reads the caller's
#     secrets, never the secrets of the org that hosts it.
#   - Workload identity federation: the four `anthropic_*` inputs below. The job's GitHub
#     OIDC token is exchanged for a short-lived Anthropic credential, so there is no
#     long-lived secret to store or leak. Prefer it for a PUBLIC repository, whose logs
#     anyone can read. The IDs are not secrets; pass them from repository variables. The
#     federation rule should match `event_name: pull_request` and this file's
#     `job_workflow_ref`, so no other job in the repository can mint a credential.
#
# Consumer repos call this from their own claude-review.yml:
#   on:
#     pull_request:
#       types: [labeled]
#   permissions:                  # REQUIRED -- see the note below
#     contents: read
#     checks: read
#     issues: write
#     pull-requests: write
#     id-token: write
#   jobs:
#     claude-review:
#       uses: tinbee/ci-workflows/.github/workflows/claude-review.yml@v1
#       with:
#         ci_check_name: "ci / CI"     # see the input's note -- this one bites
#         project_context: "A workflow orchestrator. TypeScript, mid-port to Go."
#       secrets:
#         CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#
# PASS THE SECRET EXPLICITLY, not with `secrets: inherit`. `inherit` forwards org secrets
# only when the called workflow is in the caller's own organization; from any other org
# it hands over nothing, and the job starts then fails in five seconds with "Secret
# CLAUDE_CODE_OAUTH_TOKEN is required, but not provided while calling" -- with the secret
# present and shared with the repo. The explicit form works from every org.
#
# AND LAND CALLER-FILE CHANGES ON THE DEFAULT BRANCH FIRST. claude-code-action refuses to
# run when the PR's copy of the caller workflow differs from main's ("Workflow validation
# failed ... identical content to the version on the repository's default branch"); it
# exits green and posts nothing. Fix the caller on main, update the branch, re-label.
#
# THE CALLER MUST DECLARE THOSE PERMISSIONS when its repository's default workflow
# token is read-only (Settings -> Actions -> Workflow permissions). A reusable workflow
# cannot request more than its caller holds, so the job below is rejected outright:
#
#   The nested job 'review' is requesting 'checks: read, issues: write,
#   pull-requests: write, id-token: write', but is only allowed 'checks: none,
#   issues: none, pull-requests: none, id-token: none'.
#
# That is a STARTUP FAILURE -- no jobs, no logs, no annotations, and the REST API
# exposes none of it, so the reason is visible only on the run page in the browser. A
# repo whose default is read-write (a laxer setting) works without the block, which is
# how this stays hidden until the first hardened consumer adopts the workflow.
#
# The general rules live in this repository's review-rules/ and are checked out beside
# the caller's code, so there is ONE copy of each rule rather than one per repo. A
# consumer keeps only its own invariants, in docs/review-rules/README.md.

name: Claude review (reusable)

on:
  workflow_call:
    inputs:
      runs_on:
        description: "The runner label the jobs run on. Empty (the default) means the caller's `CI_REVIEW_RUNS_ON` variable (an org variable, visible to private repos only, set only where the org has two or more self-hosted runners), and when that is unset too, GitHub's `ubuntu-latest`. Public repos never see the variable, so they stay on GitHub's free runners."
        type: string
        required: false
        default: ""
      ci_check_name:
        description: >-
          The exact check-run name to wait for. This is the input most likely to be
          wrong: a repo whose CI is a job that CALLS a reusable workflow reports the
          check as "<caller job id> / <inner job name>" -- e.g. "ci / CI", NOT "CI".
          Get it wrong and the wait never sees success, so every review is skipped
          after a 30-minute wait. The step names the mismatch explicitly rather than
          just timing out. Confirm with:
            gh api repos/OWNER/REPO/commits/SHA/check-runs --jq '.check_runs[].name'
          Defaults to the shared-workflow form, because delegating CI to
          node-pnpm-ci.yml or go-ci.yml is the house pattern here and an inline CI job
          is the exception. A repo with an inline job named `CI` passes "CI".
        type: string
        default: "ci / CI"
      label:
        description: "The label that requests a review. Consumed as the job's first step."
        type: string
        default: "claude-review"
      model_label_prefix:
        description: >-
          A label named `<prefix><model>[:<effort>]` requests a review with that model (and
          optionally effort) instead of the `model` / `effort` defaults -- for example
          `claude-review:opus`, or `claude-review:claude-opus-5-5:max`. The model is passed
          to the CLI as given, so a new model needs only a new label. Set to "" to turn
          this off.
        type: string
        default: "claude-review:"
      project_context:
        description: >-
          One or two sentences telling the reviewer what this service IS and what
          language it is in. Without it the model infers the domain from the diff,
          which is exactly the guesswork this is meant to avoid.
        type: string
        default: ""
      project_rules:
        description: "Path in the caller's repo to its own invariants. Skipped when absent."
        type: string
        default: "docs/review-rules/README.md"
      rules_ref:
        description: >-
          Ref of this repository to take the shared review-rules from. Defaults to the
          floating major so the rules move with the workflow; pin to a full version to
          freeze what a review is held to.
        type: string
        default: "v1"
      model:
        description: "Default model for the review; a `<prefix><model>` label overrides it for one PR."
        type: string
        default: "claude-sonnet-5-5"
      effort:
        description: "Default effort level passed to the CLI: low, medium, high, xhigh or max."
        type: string
        default: "high"
      max_turns:
        description: >-
          Turn cap, as a runaway guard only -- NOT a budget. The action fails a run whose
          result arrives past the cap, and by then the review has already been published
          (the prompt posts it with `gh pr comment`) and the full cost already spent. So
          exceeding this buys nothing and loses only the green check; there is no reason
          to keep it tight. Measured across three repos on 2026-09-28: 60 turns / $4.86,
          77 / $6.91, and 88 / $7.00 -- at the previous default of 80 the third was
          thrown away and the second missed by one turn.
        type: number
        default: 200
      ci_wait_attempts:
        description: "Polls of 20s each while waiting for CI. 90 = 30 minutes."
        type: number
        default: 90
      show_full_output:
        description: >-
          Print every tool call and result in the Review step's log, so a denied call is
          named: without it the run ends green or fails with "published nothing" and nothing
          says what was refused. OFF by default, because the log then carries tool RESULTS
          -- file contents and the diff -- and a secret in either is printed to anyone who
          can read the caller's Actions logs (to everyone, in a public repo). To turn it on
          while troubleshooting ONE repo without editing its caller, set the repository (or
          organization) variable CLAUDE_REVIEW_SHOW_FULL_OUTPUT to `true`, add the label
          again, and delete the variable afterwards. The variable and this input are ORed:
          either one enables it, neither can force it off.
        type: boolean
        default: false
      anthropic_federation_rule_id:
        description: >-
          Workload identity federation rule (fdrl_...). With anthropic_organization_id set,
          the review authenticates by exchanging the job's GitHub OIDC token instead of using
          CLAUDE_CODE_OAUTH_TOKEN, which is then not read. Not a secret.
        type: string
        default: ""
      anthropic_organization_id:
        description: "Anthropic organization UUID, for workload identity federation. Not a secret."
        type: string
        default: ""
      anthropic_service_account_id:
        description: "Service account (svac_...) the federated credential acts as. Not a secret."
        type: string
        default: ""
      anthropic_workspace_id:
        description: >-
          Workspace (wrkspc_...) for workload identity federation; optional when the rule
          targets a single workspace. Not a secret.
        type: string
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: >-
          OAuth token from `claude setup-token`. Required unless the anthropic_* federation
          inputs are set; the review cannot run without one or the other.
        required: false

# Re-adding the label while a run is in flight replaces it. The label name is part of the
# group so an unrelated label (whose run is skipped) cannot cancel a review in progress.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  review:
    # The job runs for every labelled PR so the label is always consumed -- a skipped job
    # would leave the label stuck on the PR, and a label that stays cannot be "added
    # again". Whether a review actually happens is decided per step below.
    # Not CI_RUNS_ON: this job waits (up to ci_wait_attempts x 20s) for the same
    # commit's CI, and with one self-hosted runner a waiting review would hold the
    # only slot while CI sat queued, then time out and skip the review with a green
    # job. CI_REVIEW_RUNS_ON is set only where the org has at least two runners
    # (tinbee/infra github-runner-do).
    runs-on: ${{ inputs.runs_on || vars.CI_REVIEW_RUNS_ON || 'ubuntu-latest' }}
    env:
      # `!= ''` first: startsWith(x, '') is true for every x, so an empty prefix would
      # turn EVERY label on the PR into a review request.
      REQUESTED: >-
        ${{ github.event.label.name == inputs.label
            || (inputs.model_label_prefix != ''
                && startsWith(github.event.label.name, inputs.model_label_prefix)) }}
      # Drafts are not ready. Fork PRs cannot see the OAuth secret, so a review there
      # would only fail. Everything after label consumption is gated on this.
      ELIGIBLE: >-
        ${{ (github.event.label.name == inputs.label
             || (inputs.model_label_prefix != ''
                 && startsWith(github.event.label.name, inputs.model_label_prefix)))
            && github.event.pull_request.draft == false
            && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      checks: read # the wait step reads this commit's check-runs
      pull-requests: write
      issues: write
      # Required by anthropics/claude-code-action: it exchanges the job's OIDC token for
      # the short-lived GitHub App token it comments with, and, under workload identity
      # federation, for the Anthropic credential the review runs on.
      id-token: write
    steps:
      # First, not last. A run cancelled by a re-label (concurrency above) never reaches
      # a trailing step, and a label still on the PR cannot be re-added. The label is a
      # one-shot request; consuming it up front keeps that true.
      - name: Consume the review label
        if: env.REQUESTED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Through env, not interpolated into the command. The label name IS
          # attacker-influenced now (anything starting with the prefix reaches
          # here), which is exactly why a `run:` block must never see it
          # interpolated. It is the label that FIRED, not `inputs.label`: with a
          # model label, removing the default one would leave this one stuck on the
          # PR, and a label that stays cannot be added again.
          PR: ${{ github.event.pull_request.number }}
          LABEL: ${{ github.event.label.name }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label "$LABEL"

      # Fail in seconds, not after the CI wait, when no credential reaches the job. The
      # secret is tested through env, never echoed.
      - name: Check a credential is configured
        if: env.ELIGIBLE == 'true'
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          FEDERATED: ${{ inputs.anthropic_federation_rule_id != '' && inputs.anthropic_organization_id != '' }}
        run: |
          if [ "$FEDERATED" = "true" ]; then
            echo "Authenticating with workload identity federation"
          elif [ "$HAS_TOKEN" = "true" ]; then
            echo "Authenticating with CLAUDE_CODE_OAUTH_TOKEN"
          else
            echo "::error::No credential for the review. Pass CLAUDE_CODE_OAUTH_TOKEN, or set anthropic_federation_rule_id and anthropic_organization_id. A public repository does not receive an org secret limited to private repositories."
            exit 1
          fi

      # Resolve the model from the label BEFORE waiting for CI, so a malformed label
      # fails in seconds instead of after a half-hour wait. The label name reaches this
      # step through env only, and the two values that leave it are validated to a
      # strict shape: they are interpolated into the CLI's arguments below, so they are
      # checked rather than escaped.
      - name: Pick the model
        id: model
        if: env.ELIGIBLE == 'true'
        env:
          LABEL: ${{ github.event.label.name }}
          BASE_LABEL: ${{ inputs.label }}
          PREFIX: ${{ inputs.model_label_prefix }}
          DEFAULT_MODEL: ${{ inputs.model }}
          DEFAULT_EFFORT: ${{ inputs.effort }}
          # `vars` in a reusable workflow is the CALLER's repository/organization
          # variables, which is what lets one repo switch this on without a code change.
          FULL_OUTPUT: ${{ inputs.show_full_output || vars.CLAUDE_REVIEW_SHOW_FULL_OUTPUT == 'true' }}
        run: |
          set -euo pipefail
          model="$DEFAULT_MODEL"
          effort="$DEFAULT_EFFORT"
          if [ "$LABEL" != "$BASE_LABEL" ]; then
            spec="${LABEL#"$PREFIX"}"
            model="${spec%%:*}"
            effort="$DEFAULT_EFFORT"
            if [[ "$spec" == *:* ]]; then
              effort="${spec#*:}"
            fi
            # An alias (`opus`) or a full id (`claude-opus-5-5`), optionally with the CLI's
            # context-window suffix (`opus[1m]`). No allow-list on purpose -- that list is
            # what would go stale when the next model ships.
            if ! [[ "$model" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}(\[[0-9]+[km]\])?$ ]]; then
              echo "::error::Label '${LABEL}' does not name a model. Use '${PREFIX}<model>' or '${PREFIX}<model>:<effort>', e.g. '${PREFIX}opus' or '${PREFIX}claude-opus-5-5:max'. A model is letters, digits, '.', '_' or '-', optionally ending in a context suffix like '[1m]'."
              exit 1
            fi
            case "$effort" in
              low|medium|high|xhigh|max) ;;
              *)
                echo "::error::Label '${LABEL}' has effort '${effort}'. Effort is one of low, medium, high, xhigh, max."
                exit 1
                ;;
            esac
          fi
          {
            echo "model=${model}"
            echo "effort=${effort}"
            echo "full_output=${FULL_OUTPUT}"
          } >> "$GITHUB_OUTPUT"
          echo "Reviewing with model '${model}' at effort '${effort}' (label: ${LABEL}); full tool output: ${FULL_OUTPUT}"

      # A model review of code that does not build, lint or pass tests is wasted quota.
      # Instant when the label is added to an already-green PR; waits when added early.
      - name: Wait for CI on this commit
        id: ci
        if: env.ELIGIBLE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          CHECK_NAME: ${{ inputs.ci_check_name }}
          ATTEMPTS: ${{ inputs.ci_wait_attempts }}
        run: |
          set -uo pipefail
          # Check-runs from pull_request workflows attach to the PR head SHA. Every page
          # is read and the newest matching run wins (reruns); an API hiccup counts as
          # "still pending" rather than failing this job.
          url="repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs"
          seen_any=no
          for _ in $(seq 1 "$ATTEMPTS"); do
            # One "<id> <conclusion>" line per matching run; highest id is newest. ids
            # are never null, unlike started_at on a queued run.
            #
            # The name reaches jq through `env`, NOT a --arg: `gh api` HAS NO --arg flag.
            # It rejects one with "unknown flag" in under a tenth of a second, and with
            # stderr discarded that read as "CI has not reported yet" -- so the wait
            # failed instantly on every repo while looking like a slow-CI skip. stderr
            # stays visible here for exactly that reason.
            line=$(gh api --paginate "$url" \
              --jq '.check_runs[] | select(.name == env.CHECK_NAME) | "\(.id) \(.conclusion // "pending")"' \
              | sort -n | tail -1) || line=""
            # `if`, not `[ -n "$line" ] && seen_any=yes`: this job runs under `bash -e`,
            # where a bare `A && B` whose A is false is a failed command and kills the
            # script. An empty first poll is the NORMAL case, so that form turned the
            # common path into a hard failure.
            if [ -n "$line" ]; then
              seen_any=yes
            fi
            conclusion=$(printf '%s' "$line" | cut -d" " -f2)
            [ -n "$conclusion" ] || conclusion=pending
            case "$conclusion" in
              success) echo "result=success" >> "$GITHUB_OUTPUT"; exit 0 ;;
              pending|null|"") sleep 20 ;;
              *) echo "CI concluded '$conclusion' -- skipping the model review"
                 echo "result=$conclusion" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
          done
          # Distinguish "CI is slow" from "ci_check_name matches nothing", which is the
          # same 30-minute timeout with a completely different fix.
          if [ "$seen_any" = no ]; then
            echo "::error::No check-run named '${CHECK_NAME}' exists on ${SHA}. Check the ci_check_name input: a repo whose CI calls a reusable workflow reports '<job id> / <inner job name>'. Names present on this commit:"
            gh api --paginate "$url" --jq '.check_runs[].name' | sort -u || true
            echo "result=no-such-check" >> "$GITHUB_OUTPUT"
          else
            echo "CI did not conclude within the wait -- skipping the model review"
            echo "result=timeout" >> "$GITHUB_OUTPUT"
          fi

      # Shallow: the review reads the PR through `gh pr diff`, not git history.
      - name: Checkout the pull request
        if: env.ELIGIBLE == 'true' && steps.ci.outputs.result == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The shared rules, beside the caller's code, sparse so the rest of this repo's
      # workflows are not dragged into the review's workspace.
      - name: Checkout the shared review rules
        if: env.ELIGIBLE == 'true' && steps.ci.outputs.result == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: tinbee/ci-workflows
          ref: ${{ inputs.rules_ref }}
          path: .shared-review-rules
          sparse-checkout: review-rules
          sparse-checkout-cone-mode: false

      # The diff goes to a file HERE, not from inside the review: the reviewer's own
      # `gh pr diff > file` is refused (a redirection needs approval, in /tmp and in the
      # workspace alike -- five denials in one run), and a large diff returned as a tool
      # result is cut off, which sent the reviewer off to delegate and end its turn. A
      # step has no such limit; the reviewer just `Read`s the file in ranges.
      - name: Save the PR diff for the reviewer
        if: env.ELIGIBLE == 'true' && steps.ci.outputs.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          mkdir -p .review-context
          gh pr diff "$PR" --name-only > .review-context/files.txt \
            || echo "::warning::could not list the changed files"
          if gh pr diff "$PR" > .review-context/pr.diff; then
            echo "Saved $(wc -l < .review-context/pr.diff) diff lines across $(wc -l < .review-context/files.txt) files"
          else
            # GitHub refuses very large diffs (20k lines). The reviewer is told what to do.
            echo "::warning::gh pr diff failed -- the reviewer gets the file list only"
            : > .review-context/pr.diff
          fi

      # The publish gate below needs to know what "new" means.
      - name: Mark the review start
        id: started
        if: env.ELIGIBLE == 'true' && steps.ci.outputs.result == 'success'
        run: echo "at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"

      - name: Review
        if: env.ELIGIBLE == 'true' && steps.ci.outputs.result == 'success'
        uses: anthropics/claude-code-action@ae68417a745a5df4b2124873632bd73a2255e6f6 # v1
        env:
          GH_TOKEN: ${{ github.token }} # for the `gh pr comment` that publishes the review
        with:
          # Federation when its IDs are set; the OAuth token otherwise, never both.
          claude_code_oauth_token: ${{ inputs.anthropic_federation_rule_id == '' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          anthropic_federation_rule_id: ${{ inputs.anthropic_federation_rule_id }}
          anthropic_organization_id: ${{ inputs.anthropic_organization_id }}
          anthropic_service_account_id: ${{ inputs.anthropic_service_account_id }}
          anthropic_workspace_id: ${{ inputs.anthropic_workspace_id }}
          use_sticky_comment: true
          show_full_output: ${{ steps.model.outputs.full_output }}
          # In prompt mode nothing is published unless the prompt says so AND the tool is
          # allowed. Least privilege: read the workspace (the rule docs), the PR
          # diff/view verbs, the comment verb, and Write -- the prompt asks for the
          # review as a FILE (`--body-file`; a multi-KB body on the command line is
          # fragile), so the tool that writes it must be allowed. Without it the model
          # got a denial on every attempt and whether the review was posted at all
          # depended on it improvising a fallback: 10 denials and a posted review one
          # run, 13 denials and a sixteen-minute review discarded the next. Nothing is
          # pushed, so Write costs nothing on GitHub's runners, which are thrown away
          # after the job. On a self-hosted runner (CI_REVIEW_RUNS_ON) the machine lives
          # on, and its job-completed hook removes what a job leaves behind.
          claude_args: >-
            --model ${{ steps.model.outputs.model }} --effort ${{ steps.model.outputs.effort }} --max-turns ${{ inputs.max_turns }}
            --allowedTools "Read,Glob,Grep,Write,Bash(gh api:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_comment__update_claude_comment"
            --disallowedTools "Agent,Task"
          prompt: |
            You are the cold-context reviewer for this pull request. You have not seen the
            author's reasoning, and the PR description's justifications are not evidence.
            Judge only what the code does.

            ${{ inputs.project_context }}

            Read `.shared-review-rules/review-rules/README.md` first: it indexes the
            general Tin Bee rules and says when each applies. Read the ones that apply to
            this diff -- reading all of them on a small diff wastes the budget that should
            go on the code. Then read `${{ inputs.project_rules }}` if it exists, for this
            project's own invariants, which add to the general rules rather than replacing
            them.

            The diff is already on disk: `.review-context/pr.diff`, with the changed file
            names in `.review-context/files.txt`. Read those. Do NOT run `gh pr diff`
            and do not try to redirect its output -- redirection is refused. A large diff
            is cut off when it arrives as a tool result, so `Read` the file in ranges
            (offset and limit) and keep going until you reach the end -- a diff you read
            only the start of is a diff you did not review. If `pr.diff` is empty, the
            diff was too large for GitHub to serve: review the files in `files.txt`
            directly from the workspace and say in the summary that you had no diff.

            Do the review yourself, in this session. Do not launch subagents or background
            tasks: this run is headless, so a turn that ends while work is outstanding ends
            the run, the work is discarded and nothing is posted. Do not end your turn
            until the review has been posted.

            Review the diff against those rules and against ordinary correctness.

            Report only CONCRETE DEFECTS. For each: `file:line`, the failure scenario
            (inputs or state -> wrong outcome), and the fix. Rank by severity. These come
            first, in this order: cross-tenant reach, secrets in logs / URLs / responses,
            TOCTOU across async boundaries, silently swallowed errors, unbounded reads,
            unsafe migrations. Skip style and naming unless it hides a bug.

            Two things to be careful about, because they cost a reviewer's credibility:
            do not report a defect you have not traced to a concrete failure, and do not
            assert a version- or config-specific fact without checking it in the repo --
            a confidently wrong claim about a flag or a library version costs more than
            the finding is worth. If a migration is included, quote every destructive
            statement and say which expand/contract phase it is.

            End with one line: "No further defects found" or "N defects" -- no
            "above" or "below". The findings are anchored to their own lines as review
            threads, so they sit beside the code and in neither direction from this
            summary, and a directional word is simply wrong. It also drifts within a
            single review: one pass wrote "Finding 2 below asks for a migration" in the
            body and "3 defects above" to close, in the same comment. Refer to a finding
            by its number and its `file:line`, never by where it is on the page.

            PUBLISH THE REVIEW AS INLINE COMMENTS, not as one PR comment. Each finding
            anchored to its own line becomes a review THREAD, which is what the reviewer
            on the other end can reply to and resolve one finding at a time -- the same
            loop Copilot findings already go through. A single comment carrying N
            findings has no threads, so a repo whose branch protection requires thread
            resolution cannot see it at all, and disagreeing with one finding means
            dismissing all of them.

            Write a JSON file to /tmp/review.json:

              {
                "event": "COMMENT",
                "body": "<the summary: which rules you read, what you checked and found
                         clean, and any finding that has no line to attach to -- a stale
                         PR description, a migration already on main, a missing test.
                         End with the one-line count.>",
                "comments": [
                  { "path": "apps/api/src/foo.ts", "line": 42, "side": "RIGHT",
                    "body": "<one finding: the failure scenario and the fix>" }
                ]
              }

            Then post it:

              gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews \
                --method POST --input /tmp/review.json

            ANCHORING RULES -- the API rejects the WHOLE review if one comment is
            misplaced, which throws away the entire run:
              - `path` and `line` must name a line the diff actually touches. Get them
                from `.review-context/pr.diff`; do not guess from reading the file.
              - `side: "RIGHT"` for added or changed lines, `"LEFT"` only for a line the
                diff removes.
              - A finding you cannot anchor goes in `body`. Never invent a line to hang
                it on.

            IF THE POST FAILS, do not stop and do not retry the same payload. Move every
            finding into `body` (keeping its file:line inline as text), set `comments` to
            `[]`, and post again. If that also fails, fall back to
            `gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/review.md`.
            A review that is not published does not exist -- the job fails if nothing
            appears.

      # The action reports success when the MODEL finished, not when anything was
      # published. Without this gate a run can review for fifteen minutes, hit a denied
      # tool call on the way out, post nothing, and end green -- the whole review and
      # its cost silently discarded, and the label already consumed. A comment newer
      # than the start is the only evidence that a review exists.
      - name: Confirm the review was posted
        if: env.ELIGIBLE == 'true' && steps.ci.outputs.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.started.outputs.at }}
        run: |
          set -euo pipefail
          # Three surfaces, because the prompt has three publish paths and only the
          # first is the good one: a review with inline threads, a review whose findings
          # all landed in the body, or the `gh pr comment` fallback. Counting only issue
          # comments would fail a run that published perfectly well as a review.
          #
          # `since` filters on updated_at, so a sticky comment edited in place counts too.
          issue_n=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments?since=${SINCE}" --jq '.[].id' | wc -l | tr -d ' ')
          # Reviews have no `since` parameter; filter client-side on submitted_at.
          review_n=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/reviews" \
            --jq "[.[] | select(.submitted_at != null and .submitted_at >= \"${SINCE}\")] | length" \
            | awk '{s+=$1} END {print s+0}')
          thread_n=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/comments" \
            --jq "[.[] | select(.created_at >= \"${SINCE}\")] | length" \
            | awk '{s+=$1} END {print s+0}')

          if [ "$((issue_n + review_n))" -eq 0 ]; then
            echo "::error::The review ran but published nothing since ${SINCE} -- no review, no PR comment. The model's output was discarded; check the Review step log for denied tool calls, then re-add the label."
            exit 1
          fi

          echo "published since ${SINCE}: ${review_n} review(s), ${thread_n} inline thread(s), ${issue_n} issue comment(s)"
          # Loud but not fatal: a review with no inline threads is the degraded path, and
          # a repo relying on required_review_thread_resolution gets no gate from it.
          if [ "$thread_n" -eq 0 ]; then
            echo "::warning::No inline threads were created, so there is nothing for branch protection's thread-resolution rule to hold. Either the diff genuinely had no line-anchorable defects, or the review fell back to a body-only post -- the Review step log says which."
          fi
