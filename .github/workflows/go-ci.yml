# Reusable workflow: CI for a Go service.
#
# The Go counterpart to node-pnpm-ci.yml, and deliberately the same shape: every step
# opts out by passing "" for its command, the job is named `CI` so consumers report the
# check as "<caller job id> / CI", and project-specific gates go in the command inputs
# rather than being baked in here.
#
# Consumer repos call this from their ci.yml:
#   jobs:
#     ci:
#       uses: tinbee/ci-workflows/.github/workflows/go-ci.yml@v1
#       with:
#         buf: true
#         sqlc_version: "1.31.1"
#         generate_command: |
#           buf generate
#           sqlc generate
#         generated_paths: internal/proto internal/cp/store/db
#         lint_command: make lint
#         golangci_version: v2.14
#         post_command: make build-agent-linux
#         goprivate: "github.com/tinbee/*"
#       secrets:
#         private_module_ssh_key: ${{ secrets.FOLIOT_SDK_DEPLOY_KEY }}
#
# NOTE ON THE CHECK NAME. Moving a repo from an inline CI job onto this workflow CHANGES
# the check-run name: an inline job named `CI` reports `CI`, while a job that calls this
# reports `<job id> / CI`. Any required-status-check ruleset pinned to the old name must
# be updated in the same change, or every check goes green and every PR stays blocked
# with nothing red to explain it.

name: Go CI (reusable)

on:
  workflow_call:
    inputs:
      go_version_file:
        description: "File the Go version is read from. Keeps CI and the module in step."
        type: string
        default: "go.mod"
      working_directory:
        description: >-
          Directory holding the Go module, relative to the repo root. Not every repo has
          it at the top: a service mid-port may keep the Go module beside the one it is
          replacing.
        type: string
        default: "."
      pre_command:
        description: >-
          Runs before anything else, from the REPO ROOT. For starting a database the
          tests need: this workflow owns the job, so a caller cannot add a `services:`
          block of its own.
        type: string
        default: ""
      buf:
        description: "Install buf (protobuf codegen). Only needed if generate_command uses it."
        type: boolean
        default: false
      sqlc_version:
        description: >-
          sqlc version to install. Empty to skip. Pin it: sqlc writes its own version
          into the generated output, so a floating version makes the freshness check
          below fail for whoever is on a different one.
        type: string
        default: ""
      generate_command:
        description: "Regenerates committed code (buf/sqlc/mockgen). Paired with generated_paths."
        type: string
        default: ""
      generated_paths:
        description: >-
          Space-separated paths the freshness check diffs after generate_command. This is
          the gate that matters: generated code that is committed but stale still
          COMPILES, and only fails later in a way that looks unrelated.
        type: string
        default: ""
      lint_command:
        description: "Project lint beyond golangci-lint (e.g. `make lint`). Empty to skip."
        type: string
        default: ""
      golangci_version:
        description: >-
          golangci-lint version, e.g. "v2.14". Empty to skip the action entirely. It must
          be a v2: the action pinned below dropped golangci-lint v1.
        type: string
        default: ""
      build_command:
        description: "Build gate."
        type: string
        default: "go build ./..."
      test_command:
        description: >-
          Test gate. The race detector is on by default and should stay on for anything
          with concurrent moving parts -- a data race that only appears under load is the
          most expensive kind to find later.
        type: string
        default: "go test -race ./..."
      post_command:
        description: "Runs last, after tests pass. Cross-compiles, artifact builds, extra gates."
        type: string
        default: ""
      govulncheck:
        description: "Scan for known vulnerabilities in REACHABLE code, not merely in the module graph."
        type: boolean
        default: true
      gofmt_check:
        description: >-
          Fail when `gofmt -l` names any file. Checked as emptiness of its output,
          because gofmt exits 0 whether or not files need formatting.
        type: boolean
        default: true
      timeout_minutes:
        type: number
        default: 20
      env_json:
        description: 'Extra env for every step, as JSON: {"FOO":"bar"}.'
        type: string
        default: "{}"
      goprivate:
        description: >-
          Comma-separated module-path globs to fetch DIRECTLY rather than through
          proxy.golang.org, e.g. "github.com/tinbee/*". Required for any private module:
          the public proxy and checksum database cannot see a private repo, and the
          failure is a 404 from the proxy that reads like a typo in the module path.
          Pair it with the private_module_ssh_key secret -- each is useless alone.
        type: string
        default: ""
    secrets:
      private_module_ssh_key:
        description: >-
          Private half of a read-only DEPLOY KEY on the repo holding the private modules
          (not this repo). Loaded into an ssh-agent for the job, with an insteadOf rewrite
          so the HTTPS URL the Go toolchain asks for is fetched over SSH.

          Needed because a repo's own GITHUB_TOKEN cannot read another repo, and cannot
          read ANY repo in another org -- which is the usual case for a shared module.

          Omit it and nothing happens: the step no-ops, so public-module repos are
          unaffected.
        required: false

jobs:
  CI:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Exported into $GITHUB_ENV rather than applied as a step-level `env:` map.
      # `env: ${{ fromJSON(inputs.env_json) }}` looks reasonable and does not load --
      # GitHub rejects an expression as the whole env map, and the run fails at
      # WORKFLOW level, which reports as the filename with no job and no annotation.
      # Same approach as node-pnpm-ci.yml.
      - name: Set env from env_json input
        if: inputs.env_json != '{}' && inputs.env_json != ''
        shell: bash
        env:
          ENV_JSON: ${{ inputs.env_json }}
        run: |
          set -euo pipefail
          echo "$ENV_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"

      # BEFORE setup-go and before pre_command, because the first thing to touch the
      # module graph wins -- buf, sqlc, golangci-lint and `go build` all fetch, and a
      # missing credential fails in whichever of them happens to run first. That makes
      # the error land somewhere unrelated to its cause.
      #
      # The secret arrives via `env:` rather than being referenced in `if:`. A step-level
      # `if: secrets.x != ''` is not evaluated the way it reads in a reusable workflow,
      # so the guard is inside the script where it is unambiguous: no key, no-op, and a
      # repo with only public modules is untouched.
      - name: Private Go modules
        env:
          PRIVATE_MODULE_SSH_KEY: ${{ secrets.private_module_ssh_key }}
          GOPRIVATE_IN: ${{ inputs.goprivate }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GOPRIVATE_IN}" ] && [ -z "${PRIVATE_MODULE_SSH_KEY}" ]; then
            echo "No private-module config; skipping."
            exit 0
          fi

          # Half-configured is the dangerous state, because it fails LATER and elsewhere:
          # GOPRIVATE alone makes Go fetch direct from a URL it cannot authenticate, and
          # a key alone leaves Go asking the public proxy for a module it cannot see.
          # Both read as "module not found".
          if [ -z "${GOPRIVATE_IN}" ] || [ -z "${PRIVATE_MODULE_SSH_KEY}" ]; then
            echo "::error::private-module config is half set: goprivate=$([ -n "${GOPRIVATE_IN}" ] && echo set || echo EMPTY), private_module_ssh_key=$([ -n "${PRIVATE_MODULE_SSH_KEY}" ] && echo set || echo EMPTY). Both are required together."
            exit 1
          fi

          echo "GOPRIVATE=${GOPRIVATE_IN}" >> "$GITHUB_ENV"

          # The agent's socket has to outlive this step, so its address goes into
          # $GITHUB_ENV. `ssh-add -` reads the key from stdin, so it is never written to
          # disk and never appears in a command line.
          eval "$(ssh-agent -s)" > /dev/null
          echo "SSH_AUTH_SOCK=${SSH_AUTH_SOCK}" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=${SSH_AGENT_PID}" >> "$GITHUB_ENV"

          # A trailing newline is required or ssh-add rejects the key as invalid --
          # `gh secret set` from a file preserves it, but a value pasted into the web UI
          # commonly loses it, and the resulting "error in libcrypto" names nothing.
          if ! printf '%s\n' "${PRIVATE_MODULE_SSH_KEY}" | ssh-add - 2>/dev/null; then
            echo "::error::could not load private_module_ssh_key into ssh-agent. It must be the PRIVATE half of an OpenSSH key with no passphrase (CI cannot enter one)."
            exit 1
          fi

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

          # Rewrite only the hosts/orgs named in goprivate, never all of github.com:
          # a blanket rewrite changes how every unrelated module is fetched, including
          # public ones that would otherwise come from the proxy.
          IFS=',' read -ra globs <<< "${GOPRIVATE_IN}"
          for glob in "${globs[@]}"; do
            prefix="${glob%/\*}"
            prefix="${prefix%/}"
            case "$prefix" in
              github.com/*)
                owner="${prefix#github.com/}"
                git config --global "url.git@github.com:${owner}/.insteadOf" "https://github.com/${owner}/"
                echo "rewrite: https://github.com/${owner}/ -> git@github.com:${owner}/"
                ;;
              *)
                echo "::warning::no SSH rewrite for '${prefix}' -- only github.com paths are handled. Fetches for it will use HTTPS and may fail."
                ;;
            esac
          done

          # Report whether the key authenticates, as a DIAGNOSTIC -- so a bad key is
          # named here rather than surfacing as "module not found" three steps later.
          #
          # Two things this got wrong on its first run, both worth keeping written down:
          #
          # 1. It was `if ssh ... | grep -q ...`. GitHub runs every step under
          #    `bash -e -o pipefail`, and `ssh -T git@github.com` ALWAYS exits 1
          #    (there is no shell access), so pipefail made the pipeline exit 1 even
          #    when grep matched -- the probe reported "does not authenticate" for a
          #    perfectly good key and failed the build before anything was fetched.
          #    The output is captured into a variable now; no pipeline is involved in
          #    the condition.
          # 2. It was FATAL. A probe that can be wrong must not gate the build. The
          #    authoritative check is whether the module actually fetches, which
          #    happens moments later and reports its own error. So this warns.
          probe="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=no -T git@github.com 2>&1 || true)"
          case "$probe" in
            *"successfully authenticated"*)
              # A deploy key greets as the repo it is installed on, a user key as the
              # user, so the identity in the greeting is itself useful in a log.
              echo "github.com: ${probe}"
              ;;
            *)
              echo "::warning::could not confirm the key authenticates to github.com; continuing, because the module fetch is the real test. ssh said: ${probe}"
              ;;
          esac

      - name: Pre-command
        if: inputs.pre_command != ''
        run: ${{ inputs.pre_command }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.working_directory }}/${{ inputs.go_version_file }}
          cache-dependency-path: ${{ inputs.working_directory }}/go.sum

      - uses: bufbuild/buf-action@v1
        if: inputs.buf
        with:
          setup_only: true

      - uses: sqlc-dev/setup-sqlc@v5
        if: inputs.sqlc_version != ''
        with:
          sqlc-version: ${{ inputs.sqlc_version }}

      # Regenerate, then diff. A stale generated file is the failure this catches, and it
      # is invisible otherwise: the tree compiles and the tests pass against the old
      # shape until something reads a column or field that is no longer there.
      - name: Generated code is current
        if: inputs.generate_command != ''
        working-directory: ${{ inputs.working_directory }}
        run: |
          ${{ inputs.generate_command }}
          if ! git diff --exit-code -- ${{ inputs.generated_paths }}; then
            echo "::error::generated code is stale -- regenerate and commit"
            exit 1
          fi

      - name: Lint
        if: inputs.lint_command != ''
        working-directory: ${{ inputs.working_directory }}
        run: ${{ inputs.lint_command }}

      # v9, not v6: golangci-lint v2 is rejected outright by action v6 with "invalid
      # version string 'v2.14' ... you must update to golangci-lint-action v7". Every
      # config here is on golangci-lint v2, so the action has to be v7 or newer; v9 also
      # runs on node24, which v6 no longer does.
      - uses: golangci/golangci-lint-action@v9
        if: inputs.golangci_version != ''
        with:
          version: ${{ inputs.golangci_version }}
          working-directory: ${{ inputs.working_directory }}

      - name: gofmt
        if: inputs.gofmt_check
        working-directory: ${{ inputs.working_directory }}
        run: |
          # The EMPTINESS of the output is the signal: gofmt -l prints the files needing
          # formatting and exits 0 either way, so `gofmt -l .` on its own never fails.
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change these files:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Build
        if: inputs.build_command != ''
        working-directory: ${{ inputs.working_directory }}
        run: ${{ inputs.build_command }}

      - name: Test
        if: inputs.test_command != ''
        working-directory: ${{ inputs.working_directory }}
        run: ${{ inputs.test_command }}

      - name: Known vulnerabilities in reachable code
        if: inputs.govulncheck
        uses: golang/govulncheck-action@v1
        with:
          # The action's go-version-input defaults to `stable` and wins over
          # go-version-file, so the scan would run the newest Go in setup-go's
          # manifest, which lags a release: go.mod at go1.27.2 against
          # manifest-stable go1.27.1 stops with "go.mod requires go >= 1.27.2".
          # Empty lets go-version-file decide, as every other step here does.
          go-version-input: ""
          go-version-file: ${{ inputs.working_directory }}/${{ inputs.go_version_file }}
          go-package: ./...
          work-dir: ${{ inputs.working_directory }}

      - name: Post-command
        if: inputs.post_command != ''
        working-directory: ${{ inputs.working_directory }}
        run: ${{ inputs.post_command }}
