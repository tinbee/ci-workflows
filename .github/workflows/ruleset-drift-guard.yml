# Reusable workflow: report when a repo's protect-main ruleset has drifted from the
# canonical one in this repository.
#
# The point is the half that is easy to miss. instastack already had a "ruleset drift
# guard" comparing its COMMITTED ruleset file against its own workflow's job names --
# useful, and blind to the thing that actually broke: the LIVE ruleset still required a
# check named `CI` after CI began reporting `ci / CI`, so every PR sat blocked with a
# clean green suite and nothing red to explain it (instastack#14, 2026-09-29). A
# file-to-file check cannot see that. This compares the file to the API.
#
# It REPORTS; it does not correct. Writing a ruleset needs admin, and a scheduled job
# holding admin on every repo is a bigger thing to own than the problem deserves. Fix
# drift by running ./rulesets/apply.sh yourself.
#
# Consumer repos call this from their own ruleset-drift-guard.yml:
#   on:
#     schedule: [{ cron: "0 9 * * 1" }]   # Monday morning is soon enough
#     workflow_dispatch:
#   jobs:
#     drift:
#       uses: tinbee/ci-workflows/.github/workflows/ruleset-drift-guard.yml@v1
#       with:
#         extra_checks: "'scope / pr-scope-guard'"
#       secrets:
#         admin_token: ${{ secrets.RULESET_READ_TOKEN }}   # required; see the input
#
# NOT on pull_request. Drift is a property of the repository, not of a change, so
# per-PR runs would report the same thing on every PR and teach everyone to ignore it.

name: Ruleset drift guard (reusable)

on:
  workflow_call:
    inputs:
      extra_checks:
        description: >-
          Required status checks this repo needs beyond the canonical "ci / CI". Shell
          word-splitting applies, so QUOTE any name containing spaces:
          "'scope / pr-scope-guard'". This is the only field a consumer is expected to
          differ on.
        type: string
        default: ""
      rules_ref:
        description: "Ref of this repository to take the canonical ruleset from."
        type: string
        default: "v1"
    secrets:
      admin_token:
        description: >-
          A token with admin on the calling repo -- a PAT or a GitHub App installation
          token. REQUIRED in practice: no workflow permission grants GITHUB_TOKEN access
          to the rulesets API, so without this the guard cannot read anything. It fails
          loudly in that case rather than passing.
        required: false

jobs:
  drift:
    runs-on: ubuntu-latest
    permissions:
      # contents only. There is NO permission that would let GITHUB_TOKEN read the
      # rulesets API: `administration` is not among the scopes a workflow can request
      # (actionlint rejects it outright), so admin_token is required in practice rather
      # than a fallback. The guard fails loudly without it, which is the point -- a
      # green run that checked nothing would be worse than no guard.
      contents: read
    steps:
      - name: Checkout the canonical ruleset
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: tinbee/ci-workflows
          ref: ${{ inputs.rules_ref }}
          sparse-checkout: rulesets
          sparse-checkout-cone-mode: false

      - name: Compare the live ruleset against the canonical one
        env:
          # The caller's token if supplied, else the job's own.
          GH_TOKEN: ${{ secrets.admin_token != '' && secrets.admin_token || github.token }}
          EXTRA: ${{ inputs.extra_checks }}
        run: |
          set -euo pipefail
          # EXTRA is word-split deliberately, with quoting honoured, because a check name
          # contains spaces ("ci / CI") and eval is the only way to turn one input string
          # into correctly quoted argv. The value comes from the caller's own workflow
          # file, never from a pull request, so it is not attacker-controlled.
          declare -a extra=()
          if [ -n "$EXTRA" ]; then
            eval "extra=($EXTRA)"
          fi
          ./rulesets/apply.sh --check "$GITHUB_REPOSITORY" "${extra[@]}"

      - name: How to fix drift
        if: failure()
        env:
          EXTRA: ${{ inputs.extra_checks }}
        run: |
          echo "::notice::From a checkout of tinbee/ci-workflows, with a token that has admin on this repo:"
          echo "::notice::  ./rulesets/apply.sh ${GITHUB_REPOSITORY} ${EXTRA}"
