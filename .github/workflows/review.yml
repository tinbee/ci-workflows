# This repository's own on-demand reviews: it calls the two review workflows it
# publishes, the way every consumer does. Add the `claude-review` or `copilot-review`
# label once a PR has settled; each job consumes its label, so adding it again requests
# another pass. `claude-review:<model>[:<effort>]` reviews that one PR with that model.
#
# Both are called at @v1, not by a local `./` path: a consumer gets the released
# workflow, so that is the one worth exercising here, and a tool reading this file sees
# the same `uses:` it sees everywhere else.
#
# Two limits that are structural, not bugs (see the header of claude-review.yml):
#   - This file has to be on `main` with identical content for the Claude review to run.
#     A PR that adds or edits it cannot review itself, and the job is GREEN when it
#     refuses.
#   - The review authenticates by workload identity federation, not CLAUDE_CODE_OAUTH_TOKEN:
#     this repository is public, its logs are readable by anyone, and an org secret
#     limited to private repositories does not reach it anyway. The four IDs are
#     repository variables (Settings -> Secrets and variables -> Actions -> Variables);
#     they are not secrets. The federation rule matches only pull_request runs of
#     claude-review.yml@refs/tags/v1 in this repository.
name: review

on:
  pull_request:
    types: [labeled]

# The default workflow token here is read-only, so each job states what it needs. A
# reusable workflow cannot request more than its caller holds.
permissions: {}

jobs:
  claude-review:
    permissions:
      contents: read
      checks: read
      issues: write
      pull-requests: write
      id-token: write
    uses: tinbee/ci-workflows/.github/workflows/claude-review.yml@v1
    with:
      # CI here is the inline `lint` job, so the check has no "<caller> / " prefix.
      ci_check_name: "lint"
      project_context: >-
        Reusable GitHub Actions workflows (.github/workflows, called by other repositories
        at the floating tag v1) and the branch-protection standard those repositories are
        held to (rulesets/: JSON group files plus apply.sh, bash and jq, which checks and
        applies them through the GitHub API). The repository is public and its workflows
        run with other repositories' secrets, so read for anything that widens a token's
        permissions, interpolates untrusted input into a `run:` script, unpins an action
        from a commit SHA, or names a private repository. Renaming an inner job is a
        breaking change: consumers require the check by name.
      anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}

  copilot-review:
    # Any label raises this event; skip the job for every other one.
    if: github.event.label.name == 'copilot-review'
    permissions:
      pull-requests: write
    uses: tinbee/ci-workflows/.github/workflows/copilot-review.yml@v1
